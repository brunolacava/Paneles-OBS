name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["*"]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-x64 --config Release

      - name: Stage package
        shell: pwsh
        run: |
          cmake --install build_x64 --config Release --prefix "$PWD/pkg"
          Copy-Item installer/INSTALAR.bat, installer/DESINSTALAR.bat pkg/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Stream-Panels-windows-x64
          path: pkg
